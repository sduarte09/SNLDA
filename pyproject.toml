[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snlda"
version = "0.1.0"
description = "Spatiotemporal Non-Linear Dynamics Assessment of precipitation datasets"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Santiago Duarte"}]
keywords = ["precipitation", "hydroinformatics", "non-linear dynamics", "ERA5-Land", "validation"]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-image",
    "netCDF4",
    "nolds",
]

[project.optional-dependencies]
viz = ["matplotlib", "plotly"]
test = ["pytest"]
notebooks = ["jupyterlab", "matplotlib", "plotly"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
